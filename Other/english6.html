<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>English 6 – Đấu trường</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
<style>
:root{color-scheme:dark;--bg:#1f1a4a;--cd:#33297a;--an:#4a3f9a;--dk:#120e2e;--r:#e2231a;--g:#00b06f;--b:#0a84ff;--y:#ffc21a;--p:#8a3ffc;--o:#ff7a1a;--mu:#b9b3e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(rgba(255,255,255,.08) 2px,transparent 2px) 0 0/28px 28px var(--bg);color:#fff;font:500 16px Fredoka,system-ui,sans-serif}
#app{max-width:560px;margin:0 auto;padding:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:10px}
.chip{background:var(--dk);border:3px solid #000;border-radius:10px;padding:4px 10px;color:#fff;font:700 14px Fredoka,sans-serif;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.chip{cursor:pointer}
.logo{background:var(--r);border:4px solid #000;box-shadow:0 6px 0 #000;border-radius:12px;padding:14px;text-align:center;font-weight:700;font-size:22px;margin:6px 0 14px}
.sec{border:3px solid #000;border-radius:10px;text-align:center;font-weight:700;padding:6px;margin:14px 0 4px}.sec.b{background:var(--b)}.sec.p{background:var(--p)}.sec.o{background:var(--o)}
.card{background:var(--cd);border:4px solid #000;border-radius:14px;box-shadow:0 5px 0 #000;padding:12px;margin:10px 0}
.btn{display:block;width:100%;border:3px solid #000;border-bottom-width:7px;border-radius:12px;padding:10px;margin:8px 0;font:700 16px Fredoka,sans-serif;color:#fff;background:var(--b);cursor:pointer;text-align:center}
.btn:active{transform:translateY(4px);border-bottom-width:3px}
.btn small{display:block;font-weight:500;opacity:.85;font-size:13px}
.btn.g{background:var(--g)}.btn.r{background:var(--r)}.btn.o{background:var(--o)}.btn.p{background:var(--p)}
.btn.opt{background:var(--an);text-align:left}.btn.opt.ok{background:var(--g)}.btn.opt.no{background:var(--r)}.btn:disabled{cursor:default}
.bar{background:var(--dk);border:3px solid #000;border-radius:8px;height:14px;overflow:hidden;margin-bottom:10px}.bar i{display:block;height:100%;background:var(--y);transition:width .3s}
.psg{background:var(--dk);border-top:4px solid var(--y);border-radius:8px;padding:10px;margin:8px 0;max-height:36vh;overflow:auto;line-height:1.45;font-size:15px}
.sign{background:#fff3c4;color:#222;border:3px solid #000;border-radius:8px;padding:8px;margin:8px 0;font-size:15px}
.exp{background:var(--dk);border-left:6px solid var(--y);border-radius:8px;padding:10px;margin:8px 0;line-height:1.45}
.bl{color:var(--y)}
.rw{display:flex;justify-content:space-between;background:#3f3592;border-radius:8px;padding:5px 10px;margin:5px 0}.rw.me{background:var(--y);color:#222}
.row2{display:flex;gap:6px}.row2 input{flex:1;min-width:0;background:var(--dk);color:#fff;border:3px solid #000;border-radius:10px;padding:6px 10px;font:700 16px Fredoka,sans-serif}
small{color:var(--mu)}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ld=k=>{try{return localStorage.getItem(k)}catch(e){return null}},sto=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const AD="Swift Cosmic Pixel Shadow Turbo Neon Mighty Lucky Frost Sky".split(" "),NN="Ninja Dragon Blocky Robot Wizard Panda Knight Falcon Slime Cat".split(" ");
const p1=a=>a[Math.random()*a.length|0],rn=()=>p1(AD)+p1(NN)+(1000+Math.random()*9000|0),sv=n=>String(n||"").replace(/[<>&"'`]/g,"").trim().slice(0,20);
const S={name:sv(ld("eng6_name"))||rn(),xp:+ld("eng6_xp")||0,co:+ld("eng6_co")||0,wr:[]},BT=Array.from({length:7},()=>({n:rn(),x:Math.random()*900|0}));
const R=[[0,"Tân binh"],[100,"Lính mới"],[300,"Chiến binh"],[600,"Cao thủ"],[1000,"Huyền thoại"]];
let G={},RP=null,AC=null;
/* ===== KẾT NỐI FIREBASE: dán địa chỉ Realtime Database của bạn vào dòng dưới (không có dấu / ở cuối) ===== */
const DB_URL="https://databasex-d5d8d-default-rtdb.asia-southeast1.firebasedatabase.app";
const ON=DB_URL.indexOf("YOUR-PROJECT")<0;
let UID=ld("eng6_uid");if(!UID){UID="u"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);sto("eng6_uid",UID)}
let LB=[],stm=null,ST="chưa kết nối",PO=false;
function sync(){if(!ON)return;clearTimeout(stm);stm=setTimeout(async()=>{try{const r=await fetch(DB_URL+"/board_eng6/"+UID+".json",{method:"PUT",body:JSON.stringify({name:S.name,xp:S.xp,coins:S.co,t:Date.now()})});if(r.ok)ST="ghi dữ liệu thành công";else ST="lỗi ghi "+r.status+" – kiểm tra Rules trên Firebase"}catch(e){ST="lỗi mạng khi ghi – "+e.message}},500)}
async function poll(){if(!ON)return;try{const r=await fetch(DB_URL+"/board_eng6.json");if(!r.ok){PO=false;ST="lỗi đọc "+r.status+" – kiểm tra Rules trên Firebase";return}const d=await r.json()||{};LB=Object.keys(d).map(k=>({id:k,n:sv(d[k].name),x:+d[k].xp||0,t:+d[k].t||0}));PO=true}catch(e){PO=false;ST="lỗi mạng khi đọc – "+e.message}}
async function lb(){await poll();ui(bd()+'<button class="btn g" onclick="mn()">🏠 Về menu</button>')}
async function restore(){if(!ON)return;try{const d=await (await fetch(DB_URL+"/board_eng6/"+UID+".json")).json();if(d){S.xp=Math.max(S.xp,+d.xp||0);S.co=Math.max(S.co,+d.coins||0);sto("eng6_xp",S.xp);sto("eng6_co",S.co)}}catch(e){}}
/* sound */
function au(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=="suspended")AC.resume()}catch(e){}return AC}
function tone(f,t,ty,v){const c=au();if(!c)return;const go=()=>{try{const s=c.currentTime+t,g=c.createGain();g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v||.3,s+.01);g.gain.exponentialRampToValueAtTime(.001,s+.5);g.connect(c.destination);[[f,ty,1],[f*2,"sine",.35]].forEach(p=>{const o=c.createOscillator(),h=c.createGain();o.type=p[1];o.frequency.value=p[0];h.gain.value=p[2];o.connect(h);h.connect(g);o.start(s);o.stop(s+.55)})}catch(e){}};c.state=="running"?go():c.resume().then(go).catch(go)}
const snd=ok=>ok?(tone(1319,0,"sine"),tone(1760,.14,"sine")):(tone(220,0,"sawtooth",.15),tone(150,.18,"sawtooth",.15));
["pointerdown","touchstart","keydown","click"].forEach(e=>document.addEventListener(e,au,{passive:true}));
/* ui */
const rk=x=>R.filter(r=>x>=r[0]).pop()[1],fm=t=>t.replace(/\[(.*?)\]/g,"<u>$1</u>");
const hdr=()=>`<div class="chips" id="hd"><button class="chip" onclick="mn()">🏠 Menu</button><span class="chip">👤 ${esc(S.name)}</span><span class="chip">🎖 ${rk(S.xp)}</span><span class="chip">⭐ ${S.xp} XP</span><span class="chip">🪙 ${S.co}</span></div>`;
const ui=h=>{clearInterval(G.tm);$("#app").innerHTML=hdr()+h;window.scrollTo(0,0)};
function add(x,c){S.xp+=x;S.co+=c;sto("eng6_xp",S.xp);sto("eng6_co",S.co);const h=$("#hd");if(h)h.outerHTML=hdr();sync()}
function rc(){const n=R.find(r=>r[0]>S.xp);return `<div class="card">🎖 <b>${rk(S.xp)}</b><br>${n?"Còn "+(n[0]-S.xp)+" XP để lên "+n[1]:"Bạn đã đạt rank cao nhất 👑"}</div>`}
function bd(){const real=ON&&PO;
const L=(real?LB.filter(r=>r.id!=UID).map(r=>({n:r.n,x:r.x})):BT.map(b=>({n:b.n,x:b.x}))).concat([{n:S.name,x:S.xp,me:1}]).sort((a,b)=>b.x-a.x).slice(0,20);
return `<div class="card"><b>🏅 Bảng xếp hạng</b>${L.map((r,i)=>`<div class="rw${r.me?" me":""}"><span>#${i+1} ${esc(r.n)}</span><b>${r.x} XP</b></div>`).join("")}<small>${real?"Người chơi thật"+(L.length<2?" – chưa có ai khác.":".")+" ":"Đang hiển thị người chơi ảo. "}${ON?"Trạng thái: "+ST+".":"Chưa cấu hình DB_URL."}</small></div>`}
function bo(){const real=ON&&PO,now=Date.now();
const L=(real?LB.filter(r=>r.id!=UID&&now-r.t<=60000).map(r=>({n:r.n,x:r.x})):BT.map(b=>({n:b.n,x:b.x}))).concat([{n:S.name,x:S.xp,me:1}]).sort((a,b)=>b.x-a.x).slice(0,20);
return `<div class="card"><b>🟢 Bảng xếp hạng – người chơi đang online</b>${L.map((r,i)=>`<div class="rw${r.me?" me":""}"><span>#${i+1} 🟢 ${esc(r.n)}</span><b>${r.x} XP</b></div>`).join("")}<small>${real?L.length+" người đang online (hoạt động trong 60 giây gần nhất). ":"Đang hiển thị người chơi ảo. "}${ON?"Trạng thái: "+ST+".":"Chưa cấu hình DB_URL."}</small></div>`}
function sn(n){S.name=sv(n)||rn();sto("eng6_name",S.name);sync();mn()}
function mn(){ui(`<div class="logo">ENGLISH 6 – ĐẤU TRƯỜNG</div>
<div class="card"><div class="row2"><input id="nm" maxlength="20" value="${esc(S.name)}" onkeydown="if(event.key=='Enter')sn(this.value)"><button class="chip" onclick="sn($('#nm').value)">💾</button><button class="chip" onclick="sn(rn())">🎲</button></div></div>${rc()}
<div class="sec b">PHẦN I – TRẮC NGHIỆM</div>
<button class="btn" onclick="gp()">Luyện tập cổ điển<small>7 nhóm câu hoặc cả 60 câu</small></button>
<button class="btn r" onclick="fast()">Đua tốc độ<small>Câu 1–40 · 15 giây · 3 mạng</small></button>
<button class="btn o" onclick="wg()">Ôn câu đã sai<small>${S.wr.length} câu trong danh sách</small></button>
<button class="btn g" onclick="rd()">Đọc (Reading)<small>4 bài đọc · câu 41–60</small></button>
<div class="sec p">PHẦN II – VIẾT & NÓI</div>
<button class="btn p" onclick="es('W','Viết câu')">Viết câu<small>Câu 61–70 · lật thẻ</small></button>
<button class="btn p" onclick="es('P','Viết đoạn')">Viết đoạn văn<small>3 chủ đề · lật thẻ</small></button>
<button class="btn p" onclick="es('S','Nói')">Nói<small>3 chủ đề · lật thẻ</small></button>
<div class="sec o">PHẦN III – THI ĐẤU</div>
<button class="btn r" onclick="thi()">⚔️ Thi đấu<small>60 câu tổng hợp · xáo trộn · sai 5 câu mất hết điểm</small></button>
<button class="btn" onclick="lb()">🏅 Bảng xếp hạng</button>`)}
const rg=(a,b)=>Array.from({length:b-a},(_,i)=>a+i);
function gp(){const g=[["Phát âm",0,5],["Trọng âm",5,10],["Từ vựng – Ngữ pháp",10,32],["Giao tiếp",32,35],["Biển báo – Thông báo",35,40],["Điền từ vào đoạn văn",40,50],["Đọc hiểu",50,60],["Tất cả 60 câu",0,60]];ui(`<div class="card"><b>Chọn nhóm câu</b></div>`+g.map(x=>`<button class="btn" onclick="pg(${x[1]},${x[2]},'${x[0]}')">${x[0]}<small>Câu ${x[1]+1}–${x[2]} · ${x[2]-x[1]} câu</small></button>`).join(""))}
function rd(){const g=[["My school",40,45],["My favourite room",45,50],["My friend Sarah",50,55],["Leo’s new start",55,60],["Cả 4 bài",40,60]];ui(`<div class="card"><b>Chọn bài đọc</b></div>`+g.map(x=>`<button class="btn g" onclick="pg(${x[1]},${x[2]},'Đọc: ${x[0]}')">${x[0]}<small>${x[2]-x[1]} câu</small></button>`).join(""))}
const pg=(a,b,t)=>play(rg(a,b),"c",t,()=>pg(a,b,t));
const fast=()=>play(rg(0,40).sort(()=>Math.random()-.5),"r","Đua tốc độ",fast);
function wg(){if(!S.wr.length){ui(`<div class="card">Chưa có câu sai nào. Hãy luyện tập trước! 🎉</div><button class="btn g" onclick="mn()">🏠 Về menu</button>`);return}play(S.wr.slice().sort((a,b)=>a-b),"w","Ôn câu đã sai",wg)}
function play(l,m,t,rp){G={l,i:0,ok:0,st:0,lv:3,wc:0,cc:0,pen:0,x0:S.xp,m,ti:t,rp};qz()}
function mk(){const U=[],sh=a=>a.sort(()=>Math.random()-.5);sh(rg(0,40)).slice(0,24).forEach(n=>U.push([n]));[40,45,50,55].forEach(a=>U.push(rg(a,a+5)));rg(0,16).forEach(i=>U.push([100+i]));return sh(U).flat()}
const comp=()=>play(mk(),"t","Thi đấu",comp),tf=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
function bad(n){G.st=0;if(n>=0&&n<100&&!S.wr.includes(n))S.wr.push(n);if(G.m=="r")G.lv--;if(G.m=="t"){G.wc++;if(G.wc>=5&&!G.pen){add(G.x0-S.xp,-G.cc);G.pen=1}}}
function ce(i){const e=ES[i],T={W:30,P:300,S:120};G.t=T[e[0]];G.ei=i;const nt=G.note?`<div class="exp">${G.note}</div>`:"";G.note="";
ui(`<div class="bar"><i style="width:${G.i/G.l.length*100}%"></i></div><div class="chips"><span class="chip">❌ ${G.wc}/5</span><span class="chip">⭐ ${S.xp-G.x0}</span><span class="chip" id="tm">⏱ ${tf(G.t)}</span></div>${nt}<div class="card">${e[1].replace(/\n/g,"<br>")}</div><div id="ms"><button class="btn o" onclick="cf()">👀 Lật xem đáp án mẫu</button></div>`);
G.tm=setInterval(()=>{G.t--;const x=$("#tm");if(x)x.textContent="⏱ "+tf(G.t);if(G.t<=0)cr(0,1)},1000)}
function cf(){clearInterval(G.tm);$("#ms").innerHTML=`<div class="exp">${ES[G.ei][2].replace(/\n/g,"<br>")}</div><button class="btn g" onclick="cr(1)">✔ Mình làm đúng</button><button class="btn r" onclick="cr(0)">✖ Cần ôn lại</button>`}
function cr(v,to){clearInterval(G.tm);snd(v);if(v){G.ok++;G.cc+=2;add(15,2)}else bad(-1);const last=G.i+1>=G.l.length||G.pen;
$("#ms").innerHTML=`<div class="exp">${to?"⏰ Hết giờ! Tính là sai.<br>":v?"✅ Đã ghi nhận.<br>":"❌ Tính là sai.<br>"}${to?"<b>Đáp án mẫu:</b><br>"+ES[G.ei][2].replace(/\n/g,"<br>"):""}${G.pen?"<br>💥 Bạn đã sai 5 câu – toàn bộ điểm của lượt thi đấu bị trừ!":""}</div><button class="btn g" onclick="nx()">${last?"🏁 Xem kết quả":"Câu tiếp ▶"}</button>`}
function thi(){ui(`<div class="logo">⚔️ THI ĐẤU</div><div class="card"><b>Luật chơi</b><br>• 60 câu tổng hợp từ tất cả các phần: 24 trắc nghiệm đơn, 4 bài đọc (20 câu), 10 viết câu, 3 viết đoạn, 3 nói; thứ tự và đáp án A–D được xáo trộn.<br>• Mỗi câu đúng +10 XP như thường.<br>• <b>Sai 5 câu</b>: toàn bộ XP và xu kiếm được trong lượt thi đấu này bị trừ hết và lượt kết thúc.<br>• Thời gian: trắc nghiệm đơn 10 giây; mỗi bài đọc 45 giây cho cả 5 câu; viết câu 30 giây; viết đoạn 5 phút; nói 2 phút. Hết giờ tính là sai.<br>• Thẻ viết và nói tự đánh giá, làm đúng +15 XP.</div><button class="btn r" onclick="comp()">⚔️ Bắt đầu thi đấu</button><button class="btn g" onclick="mn()">🏠 Về menu</button>`)}
const PI=n=>n<40?-1:(n-40)/5|0;
function qz(){if(G.i>=G.l.length)return fin();const n=G.l[G.i];if(n>=100)return ce(n-100);const d=M[n],k=PI(n);
if(G.m=="t"){if(k<0){G.rs=-1;G.t=10}else if(G.rs!=k){G.rs=k;G.t=45}else if(G.t<=0){bad(n);G.i++;G.note="⏰ Hết 45 giây – các câu còn lại của bài đọc bị tính sai.";return G.pen?fin(1):qz()}}else G.t=15;
G.pm=G.m=="t"?[0,1,2,3].sort(()=>Math.random()-.5):[0,1,2,3];
let h=`<div class="bar"><i style="width:${G.i/G.l.length*100}%"></i></div>`;
if(G.m=="r")h+=`<div class="chips"><span class="chip">${"❤️".repeat(G.lv)}</span><span class="chip">🔥 ${G.st}</span><span class="chip" id="tm">⏱ 15s</span></div>`;
if(G.m=="t"){h+=`<div class="chips"><span class="chip">❌ ${G.wc}/5</span><span class="chip">⭐ ${S.xp-G.x0}</span><span class="chip" id="tm">⏱ ${G.t}s</span></div>`+(G.note?`<div class="exp">${G.note}</div>`:"");G.note=""}
if(k>=0)h+=`<div class="psg"><b>${P[k][0]}</b><br>${P[k][1].replace(/\n/g,"<br>").replace(/\((\d\d)\) ______/g,'<b class="bl">($1) ____</b>')}</div>`;
if(d[4])h+=`<div class="sign">${d[4]}</div>`;
h+=`<div class="card"><small>Câu ${n+1}</small><br>${fm(d[1])}</div>`+G.pm.map((j,i)=>`<button class="btn opt" onclick="pk(${i})">${"ABCD"[i]}. ${fm(d[2][j])}</button>`).join("");
h+=G.m=="r"?`<button class="btn o" id="by" onclick="by()">⏱ +5 giây · 5 🪙</button>`:"";
ui(h+`<div id="ms"></div>`);
if(G.m=="r"||G.m=="t")G.tm=setInterval(()=>{G.t--;const e=$("#tm");if(e)e.textContent="⏱ "+G.t+"s";if(G.t<=0)pk(-1)},1000)}
function by(){if(S.co<5){$("#ms").innerHTML=`<div class="exp">Không đủ xu để mua thêm giây.</div>`;return}add(0,-5);G.t+=5;$("#tm").textContent="⏱ "+G.t+"s"}
function pk(c){clearInterval(G.tm);const n=G.l[G.i],d=M[n],ok=c>=0&&G.pm[c]==d[3],cp=G.pm.indexOf(d[3]);
document.querySelectorAll(".opt").forEach((b,i)=>{b.disabled=true;if(i==cp)b.classList.add("ok");else if(i==c)b.classList.add("no")});
const bb=$("#by");if(bb)bb.disabled=true;snd(ok);
if(ok){G.ok++;G.st++;S.wr=S.wr.filter(x=>x!=n);const cc=G.st>=3?3:2;G.cc+=cc;add(10,cc)}else bad(n)
const last=G.i+1>=G.l.length||G.lv<=0||G.pen;
$("#ms").innerHTML=`<div class="exp">${ok?"✅ Chính xác!":c<0?"⏰ Hết giờ!":"❌ Chưa đúng."} Đáp án đúng: <b>${"ABCD"[cp]}. ${fm(d[2][d[3]])}</b>${G.pen?"<br>💥 Bạn đã sai 5 câu – toàn bộ điểm của lượt thi đấu bị trừ!":""}</div><button class="btn g" onclick="nx()">${last?"🏁 Xem kết quả":"Câu tiếp ▶"}</button>`}
function nx(){G.i++;(G.m=="r"&&G.lv<=0)||G.pen?fin(1):qz()}
function fin(dead){const tot=G.m=="r"||G.pen?G.i:G.l.length;res(dead?(G.pen?"💥":"💀"):null,dead?(G.pen?"SAI 5 CÂU – MẤT HẾT ĐIỂM!":"HẾT MẠNG!"):G.ti,G.ok,tot,G.rp,dead)}
function res(ic,t,ok,tot,rp,dead){const p=tot?Math.round(ok/tot*100):0;RP=rp;ic=ic||(p>=80?"🏆":p>=50?"👍":"💪");
